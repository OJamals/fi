# FI subscription plugins compose after the upstream base bundle.
# Cordis injection owns service ordering; this layer does not create credentials or routes.
- id: web
  config:
    searchProvider: fi-preferred-search
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

- insert:
    - id: fi-authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: fi-authorization-controller
      name: '@fi/api-authorization-controller'

    - id: fi-ui-model-signin
      name: '@fi/client-ui-model-signin'

    - id: fi-antigravity
      name: '@fi/llm-antigravity'

    - id: fi-provider-compat
      name: '@fi/provider-compat'

    - id: fi-web-search-preferences
      name: '@fi/web-search-preferences'

    - id: fi-ui-web-search-preferences
      name: '@fi/client-ui-web-search-preferences'

    - id: fi-image-generation
      name: '@fi/tool-image-generation'
      config:
        defaultProvider: codex
        targets:
          codex:
            imageModel: gpt-image-2
          grok:
            imageModel: grok-imagine-image-2.0
          antigravity:
            imageModel: gemini-3.1-flash-image
