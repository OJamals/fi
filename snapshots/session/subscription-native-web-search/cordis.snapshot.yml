# Keyless replay keeps the shipped headless application and native provider
# composition while replacing only the conversation model and upstream HTTP.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: fi-preferred-search
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subscription-native-search-fixture
      name: './subscription-native-search-fixture.mjs'

    - id: fi-web-search-preferences
      name: '@fi/web-search-preferences'
      config:
        provider: subscription-native
        subscriptionProvider: codex
        subscriptionModel: gpt-5.6-sol
        subscriptionMaxResponseBytes: 4096
