name: CI main

on:
  # FI validates locally; hosted CI runs only by explicit manual dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Standard hosted runners have less capacity than the upstream enterprise pool.
  DSH_GATE_CONCURRENCY: '2'
  DSH_GATE_FAIL_FAST: '1'
  DSH_COVERAGE_PARTITIONS: '2'
  DSH_COVERAGE_MAX_WORKERS: '2'
  DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
  DSH_WEB_SNAPSHOT_WORKERS: '2'
  DSH_SNAPSHOT_MAX_CONCURRENCY: '2'
  DSH_PUBLINT_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'
  DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'

jobs:
  checks:
    name: main / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [static, coverage, consumers]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate temporary storage and compile cache
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        if: matrix.suite != 'static'
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Install browser runtimes
        if: matrix.suite == 'consumers'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit

      - name: Build and execute the Linux Office runtime
        if: matrix.suite == 'consumers'
        run: CI=true pnpm run prepare:primary-runtime --target linux-x64 --output "$RUNNER_TEMP/office-runtime" --cache "$RUNNER_TEMP/office-runtime-downloads"

      - name: Run checks
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.before || github.sha }}
        run: pnpm run check:ci:${{ matrix.suite }}

  all-checks-passed:
    name: main / all checks passed
    runs-on: ubuntu-24.04
    needs: checks
    if: ${{ !cancelled() }}
    steps:
      - name: Require every suite to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
