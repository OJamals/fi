name: FI provider settings update

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out FI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Refresh public provider metadata
        run: node scripts/fi-provider-settings-update.mjs

      - name: Open or update the review
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/fi-provider-settings
          delete-branch: true
          commit-message: 'chore(fi): update provider settings metadata'
          title: 'chore(fi): update provider settings metadata'
          body: |
            Automated public release metadata refresh through FI's provenance-pinned auth2api updater.

            Capture-gated runtime fingerprints are not advanced from release metadata. Review any stale fingerprint diagnostic separately before merging.
          add-paths: |
            packages/fi/provider-compat/src/provider-settings.json
            packages/fi/provider-compat/src/provider-settings.provenance.json
